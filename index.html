<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="referrer" content="strict-origin-when-cross-origin">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>When life gives you tangerines 🍊 by Irene</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&family=Gaegu:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#eef3ec; --sky1:#cfe4ea; --sky2:#f5f0dc; --sun:#fbe3a6;
  --hill:#a7c486; --hill2:#86ab6b; --road:#dcc49b; --road2:#c9ad80;
  --ink:#2c3a2b; --muted:#5b6a58; --card:#fbfaf2; --line:#d3dccb;
  --tang:#f28a1e; --tang-d:#d8641a; --leaf:#3f7d3a; --leaf2:#64a24a; --leaf3:#2a5f2d;
  --trunk:#5b4332; --stone:#3a3b3f; --stone2:#4f5156;
  --purple:#3e2257; --hoodie:#2a3039; --skin:#d9a487; --hair:#4b2a1f;
  color-scheme:light;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --paper:#131a17; --sky1:#1b2a3a; --sky2:#33384a; --sun:#e9e3c7;
    --hill:#3e5c37; --hill2:#2e4a2b; --road:#6f5d44; --road2:#5d4d38;
    --ink:#eeede2; --muted:#a9b4a4; --card:#1c2420; --line:#334139;
    --leaf:#3b7536; --leaf2:#558f40; --leaf3:#24502a; --trunk:#4a3628;
    --stone:#24252a; --stone2:#33353b; --purple:#5a3483; --hoodie:#3a4250;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --paper:#131a17; --sky1:#1b2a3a; --sky2:#33384a; --sun:#e9e3c7;
  --hill:#3e5c37; --hill2:#2e4a2b; --road:#6f5d44; --road2:#5d4d38;
  --ink:#eeede2; --muted:#a9b4a4; --card:#1c2420; --line:#334139;
  --leaf:#3b7536; --leaf2:#558f40; --leaf3:#24502a; --trunk:#4a3628;
  --stone:#24252a; --stone2:#33353b; --purple:#5a3483; --hoodie:#3a4250;
  color-scheme:dark;
}
*,*::before,*::after{box-sizing:inherit}
html,body{margin:0}
body{background:var(--paper);color:var(--ink);font-family:'Gowun Batang',Georgia,'Times New Roman',serif;line-height:1.6}
.scene{position:relative;overflow:hidden}
.scene svg{display:block;width:100%;height:auto}
.title{position:absolute;left:clamp(16px,4vw,56px);top:clamp(12px,3vw,40px);max-width:52%}
.title h1{margin:0;font-weight:700;font-size:clamp(1.2rem,2.9vw,2.5rem);line-height:1.1;letter-spacing:-.01em;white-space:nowrap}
.title p{margin:.2em 0 0;font-family:'Gaegu','Comic Sans MS',cursive;font-size:clamp(1.1rem,2.3vw,1.8rem);color:var(--tang-d)}

/* SVG paint */
.sky1{stop-color:var(--sky1)} .sky2{stop-color:var(--sky2)}
.f-sun{fill:var(--sun)} .f-hill{fill:var(--hill)} .f-hill2{fill:var(--hill2)}
.f-road{fill:var(--road)} .f-road2{fill:var(--road2)}
.f-leaf{fill:var(--leaf)} .f-leaf2{fill:var(--leaf2)} .f-leaf3{fill:var(--leaf3)}
.f-tang{fill:var(--tang)} .f-tangd{fill:var(--tang-d)} .f-trunk{fill:var(--trunk)}
.f-stone{fill:var(--stone)} .f-stone2{fill:var(--stone2)}
.s-purple{stroke:var(--purple)} .f-hoodie{fill:var(--hoodie)} .s-hoodie{stroke:var(--hoodie)}
.f-skin{fill:var(--skin)} .f-hair{fill:var(--hair)}

#tree{transform-box:view-box;transform-origin:905px 455px;animation:sway 6s ease-in-out infinite}
#canopy{transform-box:view-box;transform-origin:905px 330px;animation:sway2 4.4s ease-in-out infinite}
@keyframes sway{0%,100%{transform:rotate(-1.4deg)}50%{transform:rotate(1.4deg)}}
@keyframes sway2{0%,100%{transform:rotate(1.2deg) translateX(-3px)}50%{transform:rotate(-1.2deg) translateX(3px)}}
.fruit{transform-box:fill-box;transform-origin:50% 0%;animation:dangle 3.2s ease-in-out infinite}
@keyframes dangle{0%,100%{transform:rotate(-7deg)}50%{transform:rotate(7deg)}}
.falling{transform-box:fill-box;animation:fall 9s linear infinite;opacity:0}
@keyframes fall{0%{transform:translate(0,0) rotate(0);opacity:0}8%{opacity:.9}100%{transform:translate(-170px,260px) rotate(540deg);opacity:0}}

/* tracker */
.tracker{max-width:760px;margin:0 auto;padding:clamp(28px,5vw,56px) clamp(18px,5vw,32px) 64px}
.tracker h2{font-size:clamp(1.3rem,3vw,1.9rem);margin:0 0 .4em;line-height:1.2}
.lead{font-size:clamp(1.05rem,2.2vw,1.25rem);margin:0 0 1.6em;max-width:62ch}
.lead b{font-family:'Gaegu',cursive;font-size:1.45em;color:var(--tang-d);font-weight:700;font-variant-numeric:tabular-nums}
.harvest{display:none;background:var(--tang);color:#2a1606;border-radius:14px;padding:14px 18px;margin:0 0 1.4em;font-family:'Gaegu',cursive;font-size:1.5rem}
.harvest.on{display:block}
.timeline{position:relative;padding:38px 0 34px}
.track{position:relative;height:12px;border-radius:999px;background:var(--line)}
.fill{position:absolute;inset:0 auto 0 0;border-radius:999px;background:linear-gradient(90deg,#9cc46a,var(--tang))}
.marker{position:absolute;top:50%;width:26px;height:26px;margin:-13px 0 0 -13px;border-radius:50%;background:var(--tang);box-shadow:0 0 0 4px var(--paper);transition:left .6s ease}
.marker::before{content:"";position:absolute;left:10px;top:-6px;width:8px;height:7px;border-radius:0 8px 0 8px;background:var(--leaf2)}
.marker span{position:absolute;bottom:34px;left:50%;transform:translateX(-50%);white-space:nowrap;font-family:'Gaegu',cursive;font-size:1.15rem;color:var(--ink)}
.ends{display:flex;justify-content:space-between;gap:12px;font-size:.92rem;color:var(--muted);margin-top:.4em}
.ends div:last-child{text-align:right}
.ends strong{display:block;color:var(--ink);font-weight:700}
.ticks{position:relative;height:22px;margin-top:8px}
.tick{position:absolute;transform:translateX(-50%);font-size:.78rem;color:var(--muted)}
.tick::before{content:"";position:absolute;left:50%;top:-10px;width:1px;height:6px;background:var(--muted);opacity:.6}
.note{margin-top:2em;font-size:.95rem;color:var(--muted)}
@media (max-width:560px){.tick:nth-child(even){display:none}}
.music{position:fixed;right:16px;bottom:calc(16px + env(safe-area-inset-bottom,0px));display:flex;gap:8px;align-items:center;z-index:5}
.music button,.music a{font:inherit;font-size:.95rem;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:999px;padding:8px 16px;cursor:pointer;text-decoration:none;box-shadow:0 2px 10px rgba(0,0,0,.08)}
.music button[aria-pressed="true"]{background:var(--tang);color:#2a1606;border-color:var(--tang)}
.music button:focus-visible,.music a:focus-visible{outline:2px solid var(--tang-d);outline-offset:2px}
.title .video{position:relative;width:21vw;aspect-ratio:16/9;margin-top:.7em;border-radius:12px;overflow:hidden;background:#000;box-shadow:0 6px 18px rgba(0,0,0,.18)}
.title .video iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
@media (max-width:760px){
  .scene{display:flex;flex-direction:column}
  .title{position:static;order:-1;max-width:none;padding:16px 16px 4px}
  .title h1{white-space:normal}
  .title .video{width:100%}
}
@media (prefers-reduced-motion:reduce){#tree,#canopy,.fruit,.falling{animation:none}.falling{opacity:0}}
</style>
</head>
<body>

<section class="scene" aria-label="Irene rides her purple bicycle past a swaying tangerine tree">
<svg viewBox="0 0 1200 560" xmlns="http://www.w3.org/2000/svg" role="img">
  <defs>
    <linearGradient id="skyG" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" class="sky1"/><stop offset="1" class="sky2"/>
    </linearGradient>
    <filter id="wc" x="-15%" y="-15%" width="130%" height="130%">
      <feTurbulence type="fractalNoise" baseFrequency="0.03" numOctaves="2" seed="4"/>
      <feDisplacementMap in="SourceGraphic" scale="16"/>
    </filter>
    <filter id="soft"><feGaussianBlur stdDeviation="6"/></filter>
  </defs>

  <rect width="1200" height="560" fill="url(#skyG)"/>
  <circle cx="560" cy="110" r="46" class="f-sun" opacity=".75" filter="url(#soft)"/>
  <circle cx="560" cy="110" r="34" class="f-sun"/>

  <path class="f-hill2" opacity=".85" d="M0,350 C180,300 380,330 590,305 S980,270 1200,315 L1200,560 L0,560Z"/>
  <path class="f-hill" d="M0,420 C300,385 700,425 1200,392 L1200,560 L0,560Z"/>

  <g id="wall"></g>

  <g id="tree">
    <path class="f-trunk" d="M874,456 C888,405 892,362 870,322 C858,302 838,292 812,282 L820,272 C852,284 878,298 891,314 C898,290 906,268 932,246 L942,255 C920,280 913,310 913,342 C915,392 922,424 940,456 Z"/>
    <g id="canopy">
      <g id="blobs" filter="url(#wc)"></g>
      <g id="leaves"></g>
      <g id="fruits"></g>
    </g>
  </g>

  <ellipse class="falling f-leaf2" cx="820" cy="250" rx="6" ry="3" style="animation-delay:0s"/>
  <ellipse class="falling f-leaf" cx="960" cy="230" rx="6" ry="3" style="animation-delay:3.2s"/>
  <ellipse class="falling f-leaf2" cx="1030" cy="280" rx="5" ry="2.5" style="animation-delay:6.1s"/>

  <path class="f-road" d="M0,476 C400,466 800,486 1200,472 L1200,545 C800,556 400,538 0,548Z"/>
  <path class="f-road2" opacity=".5" d="M0,520 C400,512 800,528 1200,516 L1200,524 C800,536 400,520 0,528Z"/>

  <!-- Irene on her bicycle (drawn facing right) -->
  <g id="rider">
    <g id="riderInner">
      <ellipse cx="0" cy="2" rx="78" ry="6" fill="#000" opacity=".13"/>
      <path id="farLeg" fill="none" stroke="#6f6c48" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/>
      <g id="wheelR" transform="translate(-40,-28)"></g>
      <g id="wheelF" transform="translate(42,-28)"></g>
      <!-- rear rack + crate of tangerines -->
      <path d="M-40,-28 L-50,-60 M-14,-62 L-60,-62" stroke="#1e1e22" stroke-width="2.5" fill="none" stroke-linecap="round"/>
      <circle class="f-tang" cx="-53" cy="-80" r="5.5"/><circle class="f-tang" cx="-43" cy="-81" r="5.5"/><circle class="f-tangd" cx="-34" cy="-80" r="5"/>
      <rect x="-62" y="-78" width="34" height="16" rx="2" fill="#a8733f"/>
      <path d="M-62,-70 H-28" stroke="#7e5430" stroke-width="1.5"/>
      <!-- frame -->
      <g class="s-purple" fill="none" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round">
        <path d="M-40,-28 L0,-26 L-12,-68 L-40,-28"/>
        <path d="M-12,-66 L34,-70"/>
        <path d="M0,-26 L35,-62"/>
        <path d="M34,-75 L36,-62 L42,-28"/>
      </g>
      <path d="M-12,-68 L-14,-76" stroke="#1e1e22" stroke-width="3"/>
      <ellipse cx="-14" cy="-78" rx="11" ry="3.6" fill="#1e1e22"/>
      <path d="M34,-75 L33,-85 L24,-87" stroke="#1e1e22" stroke-width="3.5" fill="none" stroke-linecap="round"/>
      <circle cx="0" cy="-26" r="8" fill="none" stroke="#5a5a60" stroke-width="2"/>
      <path id="crank" stroke="#2a2a2e" stroke-width="3" stroke-linecap="round"/>
      <!-- body -->
      <path class="f-hoodie" d="M-22,-84 C-20,-100 -8,-120 6,-124 C14,-126 20,-120 18,-112 C14,-100 4,-88 -4,-80 Z"/>
      <path class="f-hoodie" d="M-2,-124 C-8,-130 -6,-138 2,-136 L6,-126Z"/>
      <path class="f-hair" d="M4,-140 C-4,-136 -6,-126 0,-118 C4,-114 10,-118 12,-122 C14,-128 18,-128 20,-126 L22,-140 Z"/>
      <circle class="f-skin" cx="17" cy="-133" r="9.5"/>
      <path class="f-hair" d="M8,-132 C6,-126 10,-122 13,-124 C12,-128 12,-130 14,-133 Z"/>
      <rect x="18" y="-137" width="10" height="4.5" rx="2" fill="#1d2d5c"/>
      <circle cx="12" cy="-126" r="1.8" fill="#3a9a8c"/>
      <path d="M2,-136 C4,-152 30,-154 31,-137 Z" fill="#111114"/>
      <path d="M8,-146 L22,-148" stroke="#3a3a40" stroke-width="2" stroke-linecap="round"/>
      <path d="M26,-133 L29,-130 L26,-129" fill="none" stroke="#b9826a" stroke-width="1.2"/>
      <path id="nearLeg" fill="none" stroke="#8c8a5c" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/>
      <path class="s-hoodie" d="M10,-116 L22,-100 L26,-88" fill="none" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
      <circle class="f-skin" cx="26" cy="-87" r="3.5"/>
    </g>
  </g>
</svg>
<div class="title">
  <h1>When life gives you tangerines 🍊</h1>
  <p>by Irene</p>
  <div class="video">
    <iframe src="https://www.youtube.com/embed/fYBzdpSx-Ac?autoplay=1&mute=1&loop=1&playlist=fYBzdpSx-Ac&playsinline=1&rel=0"
      title="When Life Gives You Tangerines 🍊 Intro/Opening Song | Spring by Kim Jung Mi" frameborder="0"
      allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share"
      referrerpolicy="strict-origin-when-cross-origin" allowfullscreen></iframe>
  </div>
</div>
</section>

<section class="tracker" aria-live="polite">
  <h2>Until Irene's tree is ready again</h2>
  <div class="harvest" id="harvest">Harvest day! Irene's tangerines are ready today.</div>
  <p class="lead" id="lead">Counting…</p>

  <div class="timeline">
    <div class="track" id="track">
      <div class="fill" id="fill"></div>
      <div class="marker" id="marker"><span>today</span></div>
    </div>
    <div class="ticks" id="ticks"></div>
    <div class="ends">
      <div>Last basket<strong id="lastLbl"></strong></div>
      <div>Next harvest<strong id="nextLbl"></strong></div>
    </div>
  </div>
  <p class="note" id="note"></p>
</section>

<script>
(function(){
  const NS="http://www.w3.org/2000/svg";
  const el=(t,a,p)=>{const e=document.createElementNS(NS,t);for(const k in a)e.setAttribute(k,a[k]);if(p)p.appendChild(e);return e};
  let seed=12102026; const rnd=()=>{seed|=0;seed=seed+0x6D2B79F5|0;let t=Math.imul(seed^seed>>>15,1|seed);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296};

  /* stone wall */
  const wall=document.getElementById('wall');
  for(let row=0;row<2;row++){
    let x=-10;
    while(x<640){
      const rx=16+rnd()*12, ry=11+rnd()*6;
      el('ellipse',{cx:x+rx,cy:438-row*20+rnd()*4,rx,ry,class:rnd()>.5?'f-stone':'f-stone2',transform:`rotate(${(rnd()-.5)*20} ${x+rx} 430)`},wall);
      x+=rx*2-4;
    }
  }

  /* canopy */
  const blobs=document.getElementById('blobs');
  const B=[[905,205,118,'f-leaf'],[790,235,84,'f-leaf3'],[1022,228,88,'f-leaf3'],[860,125,84,'f-leaf2'],[972,118,80,'f-leaf'],[915,78,58,'f-leaf2'],[745,292,52,'f-leaf'],[1072,292,58,'f-leaf'],[830,302,68,'f-leaf2'],[990,302,70,'f-leaf2'],[905,305,72,'f-leaf'],[700,245,40,'f-leaf2'],[1112,232,44,'f-leaf2']];
  B.forEach(b=>el('circle',{cx:b[0],cy:b[1],r:b[2],class:b[3]},blobs));
  const leaves=document.getElementById('leaves');
  const cls=['f-leaf','f-leaf2','f-leaf3'];
  for(let i=0;i<190;i++){
    const a=rnd()*Math.PI*2, r=Math.sqrt(rnd());
    const x=905+Math.cos(a)*r*215, y=210+Math.sin(a)*r*140;
    el('ellipse',{cx:x,cy:y,rx:6,ry:2.8,class:cls[i%3],opacity:.85,transform:`rotate(${rnd()*180} ${x} ${y})`},leaves);
  }
  const fruits=document.getElementById('fruits');
  for(let i=0;i<46;i++){
    const a=rnd()*Math.PI*2, r=Math.sqrt(rnd());
    const x=905+Math.cos(a)*r*195, y=215+Math.sin(a)*r*125, s=8+rnd()*4;
    const g=el('g',{class:'fruit',style:`animation-delay:${(-rnd()*3.2).toFixed(2)}s;animation-duration:${(2.6+rnd()*1.4).toFixed(2)}s`},fruits);
    el('path',{d:`M${x},${y-s-6} L${x},${y-s+1}`,stroke:'#4a3a2a','stroke-width':1.5},g);
    el('circle',{cx:x,cy:y,r:s,class:rnd()>.25?'f-tang':'f-tangd'},g);
    el('circle',{cx:x-s*.35,cy:y-s*.35,r:s*.28,fill:'#ffd59a',opacity:.7},g);
    el('ellipse',{cx:x+4,cy:y-s-1,rx:4.5,ry:2,class:'f-leaf2',transform:`rotate(-25 ${x+4} ${y-s-1})`},g);
  }

  /* wheels */
  function wheel(id){
    const g=document.getElementById(id);
    el('circle',{r:26,fill:'none',stroke:'#1a1a1d','stroke-width':5},g);
    el('circle',{r:23,fill:'none',stroke:'#8d8d92','stroke-width':1},g);
    const sp=el('g',{},g);
    for(let i=0;i<12;i++){const a=i*Math.PI/6;el('line',{x1:0,y1:0,x2:Math.cos(a)*22,y2:Math.sin(a)*22,stroke:'#9a9aa0','stroke-width':.8},sp)}
    el('circle',{r:3,fill:'#77777c'},g);
    return sp;
  }
  const spR=wheel('wheelR'), spF=wheel('wheelF');

  /* pedalling legs (simple 2-bone IK) */
  const H=[-12,-82], L1=36, L2=36, BB=[0,-26], CR=11;
  function legPath(theta){
    const F=[BB[0]+Math.cos(theta)*CR, BB[1]+Math.sin(theta)*CR];
    let dx=F[0]-H[0], dy=F[1]-H[1], d=Math.hypot(dx,dy); d=Math.min(d,L1+L2-.5);
    const ux=dx/d, uy=dy/d, a=(L1*L1-L2*L2+d*d)/(2*d), h=Math.sqrt(Math.max(0,L1*L1-a*a));
    const K=[H[0]+ux*a+uy*h, H[1]+uy*a-ux*h];
    return `M${H[0]},${H[1]} L${K[0].toFixed(1)},${K[1].toFixed(1)} L${F[0].toFixed(1)},${F[1].toFixed(1)} l7,0`;
  }
  const nearLeg=document.getElementById('nearLeg'), farLeg=document.getElementById('farLeg'), crank=document.getElementById('crank');
  const rider=document.getElementById('rider');

  const reduce=window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  const SCALE=1.05, Y=508, MIN=140, MAX=1060, SPEED=52;
  let x=MIN, dir=1, dist=0, last=performance.now();
  function frame(now){
    const dt=Math.min(.05,(now-last)/1000); last=now;
    if(!reduce){
      x+=dir*SPEED*dt; dist+=SPEED*dt;
      if(x>MAX){x=MAX;dir=-1} if(x<MIN){x=MIN;dir=1}
    }
    const wa=(dist/26)*180/Math.PI, th=dist/24;
    spR.setAttribute('transform',`rotate(${wa})`); spF.setAttribute('transform',`rotate(${wa})`);
    nearLeg.setAttribute('d',legPath(th)); farLeg.setAttribute('d',legPath(th+Math.PI));
    crank.setAttribute('d',`M${BB[0]+Math.cos(th)*CR},${BB[1]+Math.sin(th)*CR} L${BB[0]-Math.cos(th)*CR},${BB[1]-Math.sin(th)*CR}`);
    const bob=Math.sin(th*2)*.8;
    rider.setAttribute('transform',`translate(${x.toFixed(1)},${(Y+bob).toFixed(1)}) scale(${dir*SCALE},${SCALE})`);
    if(!reduce) requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);

  /* harvest tracker: yearly cycle anchored on October 12 (first basket: Monday, October 12, 2026) */
  const MONTH=9, DAY=12, FIRST_YEAR=2026, DAYMS=86400000;
  const longFmt=new Intl.DateTimeFormat('en-US',{weekday:'long',month:'long',day:'numeric',year:'numeric'});
  const shortFmt=new Intl.DateTimeFormat('en-US',{month:'short'});
  const $=id=>document.getElementById(id);
  const plural=(n,w)=>`${n} ${w}${n===1?'':'s'}`;
  let drawnFor=null;

  function cycle(now){
    let next=new Date(now.getFullYear(),MONTH,DAY);
    if(now>=next) next=new Date(now.getFullYear()+1,MONTH,DAY);
    let lastH=new Date(next.getFullYear()-1,MONTH,DAY);
    if(lastH.getFullYear()<FIRST_YEAR){lastH=new Date(FIRST_YEAR,MONTH,DAY);next=new Date(FIRST_YEAR+1,MONTH,DAY)}
    return {lastH,next};
  }
  function drawTicks(lastH,next){
    const t=$('ticks'); t.innerHTML='';
    const span=next-lastH;
    for(let i=1;i<=12;i++){
      const d=new Date(lastH.getFullYear(),MONTH+i,1);
      if(d>=next) break;
      const s=document.createElement('span'); s.className='tick';
      s.style.left=((d-lastH)/span*100)+'%';
      s.textContent=shortFmt.format(d)+(d.getMonth()===0?` ’${String(d.getFullYear()).slice(2)}`:'');
      t.appendChild(s);
    }
    $('lastLbl').textContent=longFmt.format(lastH);
    $('nextLbl').textContent=longFmt.format(next);
  }
  function tick(){
    const now=new Date(), {lastH,next}=cycle(now);
    const key=lastH.getTime();
    if(drawnFor!==key){drawTicks(lastH,next);drawnFor=key}
    const pct=Math.min(100,Math.max(0,(now-lastH)/(next-lastH)*100));
    $('fill').style.width=pct+'%'; $('marker').style.left=pct+'%';
    let diff=Math.max(0,next-now);
    const d=Math.floor(diff/DAYMS); diff-=d*DAYMS;
    const h=Math.floor(diff/3600000); diff-=h*3600000;
    const m=Math.floor(diff/60000); const s=Math.floor((diff-m*60000)/1000);
    const since=Math.floor((now-lastH)/DAYMS);
    $('harvest').classList.toggle('on', since===0);
    $('lead').innerHTML=`The next tangerines should be ready in <b>${d}</b> ${d===1?'day':'days'}, <b>${h}</b> ${h===1?'hour':'hours'}, <b>${m}</b> min and <b>${String(s).padStart(2,'0')}</b> sec.`;
    const season=lastH.getFullYear()-FIRST_YEAR+1;
    $('note').textContent = since===0
      ? `Basket number ${season} is being shared today.`
      : `Irene last shared her tangerines with us ${plural(since,'day')} ago. The tree is ${Math.floor(pct)}% of the way to basket number ${season+1}.`;
  }
  tick(); setInterval(tick,1000);
})();
</script>
